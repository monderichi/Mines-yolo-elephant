# This file configures the controller management for MoveIt for myCobot 320 M5 (arm only, no gripper)
# Joint names match official elephantrobotics URDF
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  # Configuration for the arm_controller
  arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    action_server_params:
      allowed_execution_duration_scaling: 2.0  # Allow more time for execution
      allowed_goal_duration_margin: 1.0        # Allow 1s margin at the end
      constraints:
        goal_time: 2.0                        # Allow 2s delay for goal
        stopped_velocity_tolerance: 0.05      # Allow small velocity at end

