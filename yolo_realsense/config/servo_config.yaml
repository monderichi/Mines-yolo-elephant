###############################################
# MoveIt Servo configuration for myCobot 320 M5
# Compatible with ros-jazzy-moveit-servo 2.12.x
###############################################

servo_node:
  ros__parameters:
    ## Properties of outgoing commands
    publish_period: 0.02  # 50 Hz
    max_expected_latency: 0.1  # delay between command and execution [seconds]

    ## Input command type
    command_in_type: "speed_units"  # Commands in m/s and rad/s

    ## Scale for speed_units commands
    scale:
      linear: 0.1   # Max linear velocity [m/s] - conservative for safety
      rotational: 0.3  # Max angular velocity [rad/s]
      joint: 0.5  # Max joint velocity for joint commands

    ## Output command type (for arm_controller)
    command_out_type: trajectory_msgs/JointTrajectory

    ## What to publish
    publish_joint_positions: true
    publish_joint_velocities: true
    publish_joint_accelerations: false

    ## Smoothing
    use_smoothing: true
    smoothing_filter_plugin_name: "online_signal_smoothing::AccelerationLimitedPlugin"

    ## Planning scene
    is_primary_planning_scene_monitor: false  # MoveGroup handles this
    check_octomap_collisions: false

    ## MoveIt properties
    move_group_name: arm  # myCobot 320 arm group

    ## Singularity handling
    lower_singularity_threshold: 10.0  # Start decelerating
    hard_stop_singularity_threshold: 30.0  # Hard stop
    leaving_singularity_threshold_multiplier: 2.0

    ## Joint limit margins [rad]
    joint_limit_margins: [0.1]

    ## Topic names
    cartesian_command_in_topic: ~/delta_twist_cmds  # Incoming Cartesian velocity commands
    joint_command_in_topic: ~/delta_joint_cmds  # Incoming joint velocity commands
    joint_topic: /joint_states
    status_topic: ~/status
    command_out_topic: /arm_controller/joint_trajectory

    ## Collision checking
    check_collisions: false  # Disabled for initial testing
    collision_check_rate: 10.0
    self_collision_proximity_threshold: 0.01
    scene_collision_proximity_threshold: 0.02
